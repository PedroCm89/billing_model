[project]
name = "modelo-facturacion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "pedro", email = "pedro.cm.1989@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "python-telegram-bot>=22.8",
]

[project.scripts]
modelo-facturacion = "modelo_facturacion:main"

[tool.fastapi]
entrypoint = "app.main:app"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
